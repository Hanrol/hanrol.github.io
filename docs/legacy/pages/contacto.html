<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Formulario de contacto de Benjamín Cubillos.">
        <meta name="author" content="Benjamín Cubillos">
        <meta id="theme-color" name="theme-color" content="#020617">
        <link rel="canonical" href="https://hanrol.github.io/pages/contacto.html">
        <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
        <script src="../assets/js/theme-init.js"></script>
        <link href="../assets/css/style.css" rel="stylesheet">
        <script src="../assets/js/contacto.js" defer></script>
        <title>Contacto | Benjamín Cubillos</title>
    </head>
    <body class="min-h-screen bg-slate-100 px-4 py-8 text-slate-900">
        <main class="mx-auto max-w-2xl">
            <a class="font-semibold text-violet-700 transition-colors hover:text-blue-700 hover:underline" href="../index.html#contacto">← Volver al portafolio</a>

            <section class="mt-5 rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200 sm:p-8">
                <h1 class="text-2xl font-bold text-slate-900">Formulario de contacto</h1>
                <p class="mt-2 text-slate-700">Completa los campos para enviar un mensaje.</p>

                <form id="contact-form" class="mt-6 space-y-5" novalidate>
                    <div>
                        <label class="block text-sm font-semibold text-slate-900" for="name">Nombre</label>
                        <input id="name" class="mt-2 w-full rounded-md border border-slate-300 bg-slate-50 px-3 py-2 text-slate-900 outline-none transition focus:border-violet-500 focus:ring-2 focus:ring-violet-200 dark:border-slate-700" name="name" type="text" autocomplete="name" required minlength="2">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-900" for="email">Correo</label>
                        <input id="email" class="mt-2 w-full rounded-md border border-slate-300 bg-slate-50 px-3 py-2 text-slate-900 outline-none transition focus:border-violet-500 focus:ring-2 focus:ring-violet-200 dark:border-slate-700" name="email" type="email" autocomplete="email" required>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-900" for="subject">Asunto</label>
                        <input id="subject" class="mt-2 w-full rounded-md border border-slate-300 bg-slate-50 px-3 py-2 text-slate-900 outline-none transition focus:border-violet-500 focus:ring-2 focus:ring-violet-200 dark:border-slate-700" name="subject" type="text" required minlength="3">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-900" for="message">Mensaje</label>
                        <textarea id="message" class="mt-2 min-h-36 w-full rounded-md border border-slate-300 bg-slate-50 px-3 py-2 text-slate-900 outline-none transition focus:border-violet-500 focus:ring-2 focus:ring-violet-200 dark:border-slate-700" name="message" required minlength="10"></textarea>
                    </div>

                    <button id="submit-contact" class="rounded-md bg-violet-600 px-5 py-2.5 font-semibold text-white transition-colors hover:bg-blue-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-violet-600 disabled:cursor-not-allowed disabled:opacity-60" type="submit">Enviar mensaje</button>

                    <p id="form-status" class="hidden rounded-md bg-emerald-100 px-4 py-3 text-sm font-medium text-emerald-800 dark:bg-emerald-950 dark:text-emerald-200" role="status" aria-live="polite" tabindex="-1"></p>
                </form>
            </section>
        </main>
    </body>
</html>
